# Static site, no build step. Netlify serves this folder as-is.
[build]
  publish = "."

# CMS login (GitHub OAuth). Plain ES modules, no dependencies, so still nothing to install or build.
[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
