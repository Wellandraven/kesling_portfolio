<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
      "three/addons/postprocessing/EffectComposer.js": "https://unpkg.com/three@0.184.0/examples/jsm/postprocessing/EffectComposer.js",
      "three/addons/postprocessing/RenderPass.js": "https://unpkg.com/three@0.184.0/examples/jsm/postprocessing/RenderPass.js",
      "three/addons/postprocessing/ShaderPass.js": "https://unpkg.com/three@0.184.0/examples/jsm/postprocessing/ShaderPass.js",
      "three/addons/postprocessing/UnrealBloomPass.js": "https://unpkg.com/three@0.184.0/examples/jsm/postprocessing/UnrealBloomPass.js",
      "three/addons/loaders/SVGLoader.js": "https://unpkg.com/three@0.184.0/examples/jsm/loaders/SVGLoader.js",
      "three/addons/shaders/CopyShader.js": "https://unpkg.com/three@0.184.0/examples/jsm/shaders/CopyShader.js",
      "three/addons/shaders/LuminosityHighPassShader.js": "https://unpkg.com/three@0.184.0/examples/jsm/shaders/LuminosityHighPassShader.js"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>

  <!-- HERO: neon sign scene (logic in js/hero-scene.js, controls in js/hero-ui.js) -->
  <div class="hero">
    <header class="toolbar">
      <div class="toolbar-right">
        <button type="button" class="icon-btn" data-action="sound" aria-pressed="false" aria-label="Unmute sound" title="Unmute sound">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
            <g data-when="sound-on"><path d="M16 9a4 4 0 0 1 0 6"></path><path d="M18.5 6.5a8 8 0 0 1 0 11"></path></g>
            <g data-when="sound-off"><path d="M17 9l5 6"></path><path d="M22 9l-5 6"></path></g>
          </svg>
        </button>
        <button type="button" class="icon-btn" data-action="settings" aria-label="Scene settings" aria-expanded="false" title="Scene settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn" data-action="info" aria-label="About this scene" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path>
          </svg>
        </button>
      </div>
    </header>
    <div class="hero-stage" data-hero-stage>
      <!-- one cell per sign in a flex-wrap row; the scene draws each sign at its cell's center.
           Reorder cells to reorder signs. Each label is a button that opens the sign's drawer; its text is the sign's title. -->
      <div class="sign-grid">
        <div class="sign-cell" data-sign="raven"><button type="button" class="sign-label" data-open-sign="raven"></button></div>
        <div class="sign-cell" data-sign="heart"><button type="button" class="sign-label" data-open-sign="heart"></button></div>
        <div class="sign-cell" data-sign="d20"><button type="button" class="sign-label" data-open-sign="d20"></button></div>
        <div class="sign-cell" data-sign="tools"><button type="button" class="sign-label" data-open-sign="tools"></button></div>
        <div class="sign-cell" data-sign="mmark"><button type="button" class="sign-label" data-open-sign="mmark"></button></div>
        <div class="sign-cell" data-sign="qblock"><button type="button" class="sign-label" data-open-sign="qblock"></button></div>
      </div>
      <div class="hero-vignette"></div>
    </div>
  </div>

  <!-- Scene settings panel -->
  <div class="panel settings" id="scene-settings" role="dialog" aria-label="Scene settings" hidden>
    <div class="panel-row">
      <span class="panel-title">Scene settings</span>
      <button type="button" class="close-btn" data-action="settings" aria-label="Close settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="panel-row">
      <span class="muted">Tube size</span>
      <div class="seg" role="group" aria-label="Tube size">
        <button type="button" data-size="0.25">.25×</button>
        <button type="button" data-size="0.5">.5×</button>
        <button type="button" data-size="0.75">.75×</button>
        <button type="button" data-size="1">1×</button>
      </div>
    </div>
    <label class="slider"><span class="slider-head"><span class="muted">Brightness</span><output data-out="brightness"></output></span><input type="range" min="0.2" max="2" step="0.01" data-key="brightness"></label>
    <label class="slider"><span class="slider-head"><span class="muted">Glow</span><output data-out="bloom"></output></span><input type="range" min="0" max="3" step="0.05" data-key="bloom"></label>
    <label class="slider"><span class="slider-head"><span class="muted">Fog</span><output data-out="fog"></output></span><input type="range" min="0" max="1.5" step="0.05" data-key="fog"></label>
    <label class="slider"><span class="slider-head"><span class="muted">Flicker</span><output data-out="flicker"></output></span><input type="range" min="0" max="1" step="0.05" data-key="flicker"></label>
    <label class="slider"><span class="slider-head"><span class="muted">Drift</span><output data-out="drift"></output></span><input type="range" min="0" max="3" step="0.1" data-key="drift"></label>
    <div class="panel-row">
      <span class="muted">Hover reactions</span>
      <button type="button" role="switch" class="switch" data-action="hover" aria-checked="true" aria-label="Hover reactions"><span></span></button>
    </div>
    <div class="panel-actions">
      <button type="button" class="pill pill--save" data-action="save">Save</button>
      <button type="button" class="pill" data-action="reset">Reset</button>
      <span class="saved" data-saved hidden>Saved</span>
    </div>
  </div>

  <!-- Sound credit toast -->
  <div class="panel toast" id="scene-info" role="status" hidden>
    <span>Sound effects from the talented creators at <a href="https://pixabay.com/sound-effects/search/electric/" target="_blank" rel="noopener noreferrer">Pixabay</a></span>
    <button type="button" class="close-btn" data-action="info" aria-label="Dismiss">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
    </button>
  </div>

  <!-- Sign drawer: opens when a sign is tapped. Text comes from content.json → "signs" -->
  <div class="drawer-backdrop" id="sign-drawer-backdrop" data-action="close-drawer" hidden></div>
  <div class="drawer" id="sign-drawer" role="dialog" aria-labelledby="sign-drawer-title" hidden>
    <div class="drawer-grip"></div>
    <div class="panel-row">
      <span class="drawer-title" id="sign-drawer-title"></span>
      <button type="button" class="close-btn" data-action="close-drawer" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </button>
    </div>
    <p class="drawer-text" id="sign-drawer-text"></p>
    <ul class="drawer-projects" id="sign-drawer-projects" hidden></ul>
  </div>

</body>
</html>
